<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark light"><title>MoneyControl</title>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0b0b0b;color:#f5f5f5;font:16px/1.6 system-ui,sans-serif}main{box-sizing:border-box;width:min(100%,480px);padding:32px}h1{font-size:28px}p{color:#b5b5b5}a,button{box-sizing:border-box;display:block;width:100%;margin:14px 0;padding:14px 18px;border:1px solid #555;border-radius:14px;background:#fff;color:#111;font:inherit;text-align:center;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}button:disabled{opacity:.6;cursor:wait}a:focus-visible,button:focus-visible{outline:3px solid #8adbb4;outline-offset:3px}[hidden]{display:none!important}@media(prefers-color-scheme:light){body{background:#fafafa;color:#111}p{color:#555}a{background:#111;color:white}}</style></head>
<body><main><h1>MoneyControl</h1><p id="message" role="status">Opening the new website…</p><p id="details" hidden></p><button id="transfer" hidden>Transfer my data</button><a id="continue" href="https://moneycontrol-zubbyk.pages.dev/" hidden>Open MoneyControl</a><noscript><p>MoneyControl has moved. <a href="https://moneycontrol-zubbyk.pages.dev/">Open MoneyControl</a></p></noscript></main>
<script>
const languages={
 ru:['Открываем новый сайт…','Ваши записи переедут вместе с вами','Перенесём локальные записи на новый сайт. Ничего скачивать и восстанавливать вручную не нужно.','Перенести данные','Открыть MoneyControl','Переносим записи…','Не удалось перенести записи. Они остались в этом браузере. Попробуйте ещё раз.','Разрешите открытие новой вкладки и нажмите ещё раз.','На новом сайте уже есть локальные записи. Мы не стали их менять.','Не удалось проверить записи. Они остались в этом браузере.'],
 en:['Opening the new website…','Your records will move with you','We will transfer your local records to the new website. No downloads or manual restore needed.','Transfer my data','Open MoneyControl','Transferring records…','Could not transfer your records. They are still saved in this browser. Please try again.','Allow the new tab to open and try again.','The new website already has local records. We have not changed them.','Could not check your records. They are still saved in this browser.'],
 de:['Die neue Website wird geöffnet…','Deine Einträge ziehen mit dir um','Wir übertragen deine lokalen Einträge auf die neue Website. Kein Download und keine manuelle Wiederherstellung nötig.','Daten übertragen','MoneyControl öffnen','Einträge werden übertragen…','Die Einträge konnten nicht übertragen werden. Sie bleiben in diesem Browser gespeichert. Versuche es erneut.','Erlaube das Öffnen eines neuen Tabs und versuche es erneut.','Die neue Website enthält bereits lokale Einträge. Wir haben sie nicht verändert.','Deine Einträge konnten nicht geprüft werden. Sie bleiben in diesem Browser gespeichert.'],
 es:['Abriendo el nuevo sitio…','Tus datos se mudan contigo','Transferiremos tus datos locales al nuevo sitio. Sin descargas ni restauraciones manuales.','Transferir mis datos','Abrir MoneyControl','Transfiriendo datos…','No se pudieron transferir tus datos. Siguen guardados en este navegador. Inténtalo de nuevo.','Permite abrir la nueva pestaña e inténtalo de nuevo.','El nuevo sitio ya contiene datos locales. No los hemos modificado.','No se pudieron comprobar tus datos. Siguen guardados en este navegador.']};
let language='en';try{language=localStorage.getItem('moneycontrol-language')||navigator.language.split('-')[0];}catch{}if(!languages[language])language='en';document.documentElement.lang=language;const text=languages[language],message=document.getElementById('message'),details=document.getElementById('details'),transfer=document.getElementById('transfer'),link=document.getElementById('continue');message.textContent=text[0];transfer.textContent=text[3];link.textContent=text[4];
const target=new URL('https://moneycontrol-zubbyk.pages.dev/');target.search=location.search;target.hash=location.hash;link.href=target.href;
function snapshot(){return new Promise((resolve,reject)=>{const request=indexedDB.open('moneycontrol');request.onupgradeneeded=()=>request.transaction.abort();request.onerror=()=>request.error?.name==='AbortError'?resolve({records:[],account:false}):reject(request.error);request.onblocked=()=>reject(Error('blocked'));request.onsuccess=()=>{const db=request.result;if(!db.objectStoreNames.contains('records')){db.close();resolve({records:[],account:false});return;}const stores=['records',...(db.objectStoreNames.contains('meta')?['meta']:[])],tx=db.transaction(stores,'readonly'),records=tx.objectStore('records').index('scope').getAll('guest');let keys,values,onboarding;if(stores.includes('meta')){const meta=tx.objectStore('meta');keys=meta.getAllKeys();values=meta.getAll();onboarding=meta.get('onboarding:guest');}tx.onabort=()=>reject(tx.error);tx.onerror=()=>reject(tx.error);tx.oncomplete=()=>{db.close();const account=keys?.result.some((key,index)=>{if(typeof key!=='string'||!key.startsWith('auth:sb-')||!key.endsWith('-auth-token'))return false;try{const session=JSON.parse(values.result[index]);return typeof session?.user?.id==='string'&&typeof session.access_token==='string'&&session.access_token.length>0;}catch{return false;}})??false;resolve({records:records.result,account,onboarding:onboarding?.result===true});};};});}
let stopTransfer=()=>{};
async function start(){try{const data=await snapshot();if(data.account||!data.records.some(record=>!record.deleted)){location.replace(target.href);return;}message.textContent=text[1];details.hidden=false;details.textContent=text[2];transfer.hidden=false;
transfer.onclick=()=>{stopTransfer();const nonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join(''),receiver=new URL(target.origin+'/');receiver.hash=new URLSearchParams({'legacy-migrate':nonce,lang:language}).toString();let opened,timer;const fail=code=>{stopTransfer();message.textContent=text[code==='conflict'?8:code==='popup'?7:6];transfer.disabled=false;transfer.textContent=text[3];link.hidden=code==='conflict'?false:true;};const receive=event=>{if(event.origin!==target.origin||event.source!==opened||event.data?.nonce!==nonce)return;if(event.data.type==='moneycontrol:legacy-ready:v1'){opened.postMessage({type:'moneycontrol:legacy-guest:v1',nonce,records:data.records.map(({id,kind,value,updatedAt,deleted})=>({id,kind,value,updatedAt,deleted})),onboarding:data.onboarding},target.origin);}else if(event.data.type==='moneycontrol:legacy-saved:v1'){stopTransfer();opened.close();location.replace(target.href);}else if(event.data.type==='moneycontrol:legacy-error:v1')fail(event.data.error);};stopTransfer=()=>{clearTimeout(timer);window.removeEventListener('message',receive);};window.addEventListener('message',receive);opened=window.open(receiver.href,'moneycontrol-migration-'+nonce);if(!opened){fail('popup');return;}message.textContent=text[5];transfer.disabled=true;timer=setTimeout(()=>fail('timeout'),60000);};
}catch{message.textContent=text[9];link.hidden=false;}}
start();
</script></body></html>
