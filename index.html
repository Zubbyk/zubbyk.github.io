<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark light"><title>MoneyControl</title>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0b0b0b;color:#f5f5f5;font:16px/1.6 system-ui,sans-serif}main{box-sizing:border-box;width:min(100%,480px);padding:32px}h1{font-size:28px}p{color:#b5b5b5}a,button{box-sizing:border-box;display:block;width:100%;margin:14px 0;padding:14px 18px;border:1px solid #555;border-radius:14px;background:#fff;color:#111;font:inherit;text-align:center;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}button{background:transparent;color:inherit}a:focus-visible,button:focus-visible{outline:3px solid #8adbb4;outline-offset:3px}[hidden]{display:none!important}@media(prefers-color-scheme:light){body{background:#fafafa;color:#111}p{color:#555}a{background:#111;color:white}}</style></head>
<body><main><h1>MoneyControl</h1><p id="message">Opening the new website…</p><p id="details" hidden></p><button id="backup" hidden>Save a backup</button><p id="result" role="status"></p><a id="continue" href="https://moneycontrol-zubbyk.pages.dev/">Open MoneyControl</a><noscript><p>MoneyControl has moved. Follow the link above.</p></noscript></main>
<script>
const languages={
 ru:['Открываем новый сайт…','MoneyControl переехал','В этом браузере есть локальные записи гостевого режима. Сохраните копию перед переходом. На новом сайте её можно восстановить в настройках. Данные аккаунта появятся после входа.','Сохранить копию','Перейти в MoneyControl','Копия подготовлена. Сохраните файл в надёжном месте.','Не удалось проверить локальные записи. Если вы пользовались гостевым режимом, сохраните старые данные перед переходом.'],
 en:['Opening the new website…','MoneyControl has moved','This browser has local guest records. Save a backup before continuing, then restore it in the new website’s settings. Account data will appear after signing in.','Save a backup','Open MoneyControl','Backup prepared. Keep the file somewhere safe.','Local records could not be checked. If you used guest mode, save your old data before continuing.'],
 de:['Die neue Website wird geöffnet…','MoneyControl ist umgezogen','Dieser Browser enthält lokale Gastdaten. Speichern Sie vor dem Wechsel eine Sicherung und stellen Sie diese in den Einstellungen der neuen Website wieder her. Kontodaten erscheinen nach der Anmeldung.','Sicherung speichern','MoneyControl öffnen','Sicherung vorbereitet. Bewahren Sie die Datei sicher auf.','Lokale Daten konnten nicht geprüft werden. Wenn Sie den Gastmodus genutzt haben, sichern Sie Ihre bisherigen Daten vor dem Wechsel.'],
 es:['Abriendo el nuevo sitio…','MoneyControl se ha mudado','Este navegador contiene datos locales del modo invitado. Guarda una copia antes de continuar y restáurala en los ajustes del nuevo sitio. Los datos de tu cuenta aparecerán al iniciar sesión.','Guardar copia','Abrir MoneyControl','Copia preparada. Guarda el archivo en un lugar seguro.','No se pudieron comprobar los datos locales. Si usabas el modo invitado, guarda tus datos anteriores antes de continuar.']};
let language='en';try{language=localStorage.getItem('moneycontrol-language')||navigator.language.split('-')[0];}catch{}if(!languages[language])language='en';document.documentElement.lang=language;const text=languages[language],message=document.getElementById('message'),details=document.getElementById('details'),backup=document.getElementById('backup'),link=document.getElementById('continue');message.textContent=text[0];backup.textContent=text[3];link.textContent=text[4];
const target=new URL('https://moneycontrol-zubbyk.pages.dev/');target.search=location.search;target.hash=location.hash;link.href=target.href;
async function guestRecords(){return new Promise((resolve,reject)=>{const request=indexedDB.open('moneycontrol');request.onupgradeneeded=()=>request.transaction.abort();request.onerror=()=>request.error?.name==='AbortError'?resolve([]):reject(request.error);request.onblocked=()=>reject(Error('blocked'));request.onsuccess=()=>{const db=request.result;if(!db.objectStoreNames.contains('records')){db.close();resolve([]);return;}const transaction=db.transaction('records','readonly'),read=transaction.objectStore('records').index('scope').getAll('guest');read.onerror=()=>reject(read.error);read.onsuccess=()=>resolve(read.result);transaction.oncomplete=()=>db.close();};});}
async function start(){try{const records=await guestRecords();if(records.some(record=>!record.deleted)){message.textContent=text[1];details.hidden=false;details.textContent=text[2];backup.hidden=false;backup.onclick=()=>{const clean=records.map(({id,kind,value,updatedAt,deleted})=>({id,kind,value,updatedAt,deleted})),content=JSON.stringify({app:'MoneyControl',version:1,exportedAt:new Date().toISOString(),records:clean},null,2),url=URL.createObjectURL(new Blob([content],{type:'application/json'})),download=document.createElement('a');download.href=url;download.download='MoneyControl-migration.backup.json';download.click();setTimeout(()=>URL.revokeObjectURL(url),10000);document.getElementById('result').textContent=text[5];};return;}location.replace(target.href);}catch{message.textContent=text[1];details.hidden=false;details.textContent=text[6];}}
start();
</script></body></html>
